name: Publicar consulta de estoque

# Roda toda vez que alguém adicionar/trocar as planilhas .xlsx na raiz do repositório,
# ou se você quiser forçar manualmente pela aba "Actions" do GitHub.
on:
  push:
    branches: [main]
    paths:
      - "*.xlsx"
  workflow_dispatch: {}

# Permissão pra o workflow poder commitar o HTML gerado de volta no repositório.
permissions:
  contents: write

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependência (openpyxl)
        run: pip install openpyxl

      - name: Gerar index.html com os dados das planilhas
        run: python3 gerar_estoque_mhc.py . consulta_estoque_mhc_template.html index.html

      - name: Publicar o index.html atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nada mudou no index.html, não precisa commitar."
          else
            git commit -m "Atualiza consulta de estoque ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
